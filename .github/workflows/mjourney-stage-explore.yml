name: M-Journey TM-01c stage exploration proof

on:
  push:
    branches:
      - feature/mjourney-stage-explore-camera
  pull_request:
    paths:
      - "src/schematic/page/mjourney_stage_explore.js"
      - "bin/mjourney-preview"
      - "tests/browser/test_mjourney_stage_explore.py"
      - "docs/MJOURNEY_STAGE_EXPLORE.md"
      - ".github/workflows/mjourney-stage-explore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-explore-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original renderer dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check optional browser module syntax
        run: node --check src/schematic/page/mjourney_stage_explore.js
      - name: Keep canonical source fixture and native projection frozen
        run: |
          python -m pytest -q tests/test_mjourney.py tests/test_mjourney_research_contract.py tests/test_mjourney_category_corridors.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("fixtures/mjourney/equipment-sanitized-v1.json")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "580a66acd1b9f55fe4fa0aa3624bb4aa500028e34cdf8bac01cf138b7c59ce00"
          print("67/87 original fixture fingerprint preserved")
          PY

  stage-explore-browser:
    needs: stage-explore-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native renderer and Chromium
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render original source-backed System
        run: |
          mkdir -p out
          python bin/mjourney-preview --system-v3 --stage-demand-corridors --html \
            --focus-path ae=edge44,edge48,edge49,edge50 \
            --focus-path direct=edge45,edge51,edge52 \
            --output out/system-browser.svg
      - name: Test optional desktop stage camera and capture real screenshots
        run: python tests/browser/test_mjourney_stage_explore.py
      - name: Re-run semantic review and responsive frame tests unchanged
        run: |
          python tests/browser/test_mjourney_semantic_review.py
          python tests/browser/test_mjourney_responsive_frame.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjourney-stage-explore-visual-review
          path: |
            out/stage-explore-fit-1440.png
            out/stage-explore-vendor-1440.png
            out/stage-explore-lifecycle-1440.png
            out/stage-explore-native-fit-950.png
            out/stage-explore-metrics.json
            out/system-browser.audit.json
            out/system-browser.research.json
            out/semantic-review-handoffs-1440.png
            out/semantic-review-metrics.json
            out/system-responsive-frame-metrics.json
          retention-days: 30
