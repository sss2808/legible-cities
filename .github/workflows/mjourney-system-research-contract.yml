name: M-Journey System research boundary
on:
  push:
    branches:
      - feature/mjourney-system-research-contract
  pull_request:
    paths:
      - "src/schematic/mjourney_research_contract.py"
      - "src/schematic/mjourney_category_corridors.py"
      - "src/schematic/mjourney.py"
      - "tests/test_mjourney_category_corridors.py"
      - "tests/browser/test_mjourney_category_browser.py"
      - "src/schematic/page/mjourney_inspector.js"
      - "src/schematic/page/mjourney_scene.js"
      - "src/schematic/page/mjourney_corridor_router.js"
      - "docs/MJOURNEY_SYSTEM_CONSTRAINED_CORRIDOR_ROUTING.md"
      - "tests/test_mjourney_corridor_router.cjs"
      - "src/schematic/page/mjourney_labels.js"
      - "tests/browser/test_mjourney_browser.py"
      - "src/schematic/page/page.html"
      - "tests/test_mjourney_research_contract.py"
      - "bin/mjourney-preview"
      - "fixtures/mjourney/**"
      - ".github/workflows/mjourney-system-research-contract.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  canonical-research-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fork test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run original adapter and new source contract tests
        run: python -m pytest -q tests/test_mjourney.py tests/test_mjourney_research_contract.py tests/test_mjourney_category_corridors.py
      - name: Unit-test deterministic native SVG corridor candidates
        run: |
          node --check src/schematic/page/mjourney_corridor_router.js
          node tests/test_mjourney_corridor_router.cjs
      - name: Frozen equipment source must match P0a original byte certificate
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source=Path("fixtures/mjourney/equipment-sanitized-v1.json").read_bytes()
          assert hashlib.sha256(source).hexdigest()=="580a66acd1b9f55fe4fa0aa3624bb4aa500028e34cdf8bac01cf138b7c59ce00"
          print("P0a original sanitized fixture byte SHA-256 confirmed")
          PY
      - name: Render equipment System and two directed focus candidates
        run: |
          mkdir -p out
          python bin/mjourney-preview --system-v3 --html \
            --focus-path ae_epc=edge44,edge48,edge49,edge50 \
            --focus-path direct=edge45,edge51,edge52 \
            --output out/research-equipment.svg
      - name: Render alternative stage-demand System without changing original
        run: |
          python bin/mjourney-preview --system-v3 --stage-demand-corridors             --focus-path ae=edge44,edge48,edge49,edge50             --focus-path direct=edge45,edge51,edge52             --output out/research-category-corridors.svg
      - name: Render three-channel starter with the same contract
        run: |
          python bin/mjourney-preview --system-v3 \
            --source fixtures/mjourney/b2b-starter-v1.json \
            --output out/research-starter.svg
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path("out/research-equipment.research.json").read_text())
          s=json.loads(Path("out/research-starter.research.json").read_text())
          assert e["integrity"]["stationCount"]==67
          assert e["integrity"]["sourceRelationshipCount"]==87
          assert e["integrity"]["guideCount"]==60
          assert [x["id"] for x in e["focusSequences"]]==["ae_epc","direct"]
          assert s["integrity"]["stationCount"]==19
          assert s["integrity"]["sourceRelationshipCount"]==18
          assert s["integrity"]["guideCount"]==16
          assert not e["presentation"]["categoryGuidesNavigable"]
          assert not s["presentation"]["categoryGuidesNavigable"]
          print("No invented routes, transfers or canonical source changes")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjourney-system-canonical-research-contract
          path: |
            out/research-equipment.svg
            out/research-equipment.html
            out/research-equipment.audit.json
            out/research-equipment.research.json
            out/research-category-corridors.svg
            out/research-category-corridors.audit.json
            out/research-category-corridors.research.json
            out/research-starter.svg
            out/research-starter.audit.json
            out/research-starter.research.json
          retention-days: 30


  browser-inspector-smoke:
    needs: canonical-research-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native fork and Chromium automation
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate source-certified System browser viewer
        run: |
          mkdir -p out
          python bin/mjourney-preview --system-v3 --html \
            --focus-path ae=edge44,edge48,edge49,edge50 \
            --focus-path direct=edge45,edge51,edge52 \
            --output out/system-browser.svg
      - name: Validate real browser interaction and capture desktop widths
        run: python tests/browser/test_mjourney_browser.py
      - name: Generate stage-demand System comparison HTML
        run: |
          python bin/mjourney-preview --system-v3 --stage-demand-corridors --html             --focus-path ae=edge44,edge48,edge49,edge50             --focus-path direct=edge45,edge51,edge52             --output out/system-stage-demand.svg
      - name: Audit native stage-demand map and create comparative screenshots
        run: python tests/browser/test_mjourney_category_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjourney-system-research-browser-screens
          path: |
            out/system-stage-demand.svg
            out/system-stage-demand.html
            out/system-stage-demand.audit.json
            out/system-stage-demand.research.json
            out/system-demand-overview-950.png
            out/system-demand-focus-950.png
            out/system-demand-focus-1440.png
            out/system-demand-metrics.json
            out/system-browser.html
            out/system-browser.svg
            out/system-browser.audit.json
            out/system-browser.research.json
            out/system-research-950.png
            out/system-overview-950.png
            out/system-key-labels-950.png
            out/system-more-labels-950.png
            out/system-focus-950.png
            out/system-junctions-950.png
            out/system-corridors-950.png
            out/system-corridors-1440.png
            out/system-corridor-metrics.json
            out/system-junctions-1440.png
            out/system-focus-1440.png
            out/system-stage-950.png
            out/system-stage-1440.png
            out/system-research-1440.png
          retention-days: 30
